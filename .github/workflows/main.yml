name: Build and Publish mswnlink Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish (for example v4). Leave blank to build downloadable test artifacts only."
        required: false
        type: string
      macos_arm64_runner:
        description: "macOS Apple Silicon runner image (default macos-latest avoids macos-15 runner exhaustion)"
        required: false
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - macos-26
          - macos-15
      macos_intel_runner:
        description: "macOS Intel x64 runner image"
        required: false
        default: "macos-15-intel"
        type: choice
        options:
          - macos-15-intel
          - macos-26-intel

concurrency:
  group: mswnlink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  package:
    name: Build mswnlink for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            dist_args: "--linux AppImage --x64"
            label: fedora-x64
          - os: windows-latest
            arch: x64
            dist_args: "--win portable --x64"
            label: windows-x64
          - os: ${{ inputs.macos_intel_runner || 'macos-15-intel' }}
            arch: x64
            dist_args: "--mac dmg --x64"
            label: macos-intel-x64
          - os: ${{ inputs.macos_arm64_runner || 'macos-latest' }}
            arch: arm64
            dist_args: "--mac dmg --arm64"
            label: macos-apple-silicon-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Determine macOS signing mode
        id: mac_sign_mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          names=(MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          present=0
          missing=()
          for name in "${names[@]}"; do
            if [ -n "${!name}" ]; then present=$((present + 1)); else missing+=("$name"); fi
          done
          if [ "$present" -eq 5 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "All Apple signing/notarization secrets are present. Attempting Developer ID signed build first."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are incomplete (missing: ${missing[*]}). Packaging inside-out ad-hoc signed DMG with ScreenCaptureKit & helper entitlements via scripts/after-pack.cjs."
          fi

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 make g++ pkg-config \
            libxtst-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxkbfile-dev libxfixes-dev libxdamage-dev libxrender-dev libxi-dev \
            libpng-dev libpng++-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Print build environment
        shell: bash
        run: |
          node --version
          npm --version
          node -p "process.platform + ' ' + process.arch + ' -> target ${{ matrix.arch }}'"

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax across all modules
        shell: bash
        run: npm run check

      - name: Run automated unit tests (clipboard shortcuts, macOS TCC, drag clamping)
        shell: bash
        run: |
          if [ -f test/input-protocol.test.js ]; then
            npm test
          fi

      - name: Verify cross-platform executable icon assets (.ico, .icns, .png)
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const ico = fs.readFileSync("assets/mswnlink.ico");
            const icns = fs.readFileSync("assets/mswnlink.icns");
            const png = fs.readFileSync("assets/mswnlink.png");
            const hicolor512 = fs.readFileSync("assets/icons/512x512.png");
            if (ico.readUInt16LE(0) !== 0 || ico.readUInt16LE(2) !== 1 || ico.readUInt16LE(4) < 5) {
              throw new Error("Invalid Windows assets/mswnlink.ico header");
            }
            if (icns.subarray(0, 4).toString("ascii") !== "icns" || icns.length < 16384) {
              throw new Error("Invalid macOS assets/mswnlink.icns container");
            }
            if (png.subarray(0, 4).toString("hex") !== "89504e47" || hicolor512.subarray(0, 4).toString("hex") !== "89504e47") {
              throw new Error("Invalid Linux PNG icon header");
            }
            console.log("Verified executable icon assets: ico=" + ico.length + "B, icns=" + icns.length + "B, png=" + png.length + "B");
          '

      - name: Verify Windows C# SendInput & Task Manager UIPI worker compiles
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'win32-input.js')) {
            Write-Host 'win32-input.js not present; skipping C# worker check.'
            exit 0
          }
          $raw = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath 'win32-input.js'))
          $match = [regex]::Match($raw, '(?s)\$code\s*=\s*@"[\r\n]+(.*?)[\r\n]+"@')
          if (-not $match.Success) {
            throw 'Could not extract C# worker source from win32-input.js.'
          }
          Add-Type -TypeDefinition $match.Groups[1].Value -Language CSharp
          $elevated = [MswnlinkWin32Worker]::IsElevated()
          Write-Host "Verified MswnlinkWin32Worker C# compilation under Windows PowerShell $($PSVersionTable.PSVersion) (IsElevated=$elevated)"

      - name: Build native RobotJS input backend for Electron
        shell: bash
        env:
          CFLAGS: -Wno-deprecated-declarations
          CXXFLAGS: -Wno-deprecated-declarations
        run: npx electron-rebuild -f -w robotjs --arch ${{ matrix.arch }}

      - name: Verify compiled RobotJS native input backend
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const robotDir = path.join("node_modules", "robotjs");
            const candidates = [];
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p);
                else if (e.name.endsWith(".node")) candidates.push(p);
              }
            }
            walk(path.join(robotDir, "build"));
            walk(path.join(robotDir, "prebuilds"));
            const validBin = candidates.find((f) => fs.statSync(f).size >= 4096);
            if (!validBin) {
              console.error("No valid RobotJS .node binary found in build/ or prebuilds/");
              process.exit(1);
            }
            const r = require("robotjs");
            if (!r || typeof r.moveMouse !== "function" || typeof r.keyToggle !== "function") {
              console.error("RobotJS native module exports failed verification");
              process.exit(1);
            }
            console.log("Verified RobotJS native input backend:", validBin, "(" + fs.statSync(validBin).size + " bytes)");
          '

      - name: Package Linux or Windows executable
        if: runner.os != 'macOS'
        shell: bash
        run: npx electron-builder ${{ matrix.dist_args }} --publish never

      - name: Verify Fedora AppImage embeds desktop icon (.DirIcon)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for appimg in release/*.AppImage; do
            chmod +x "$appimg"
            EXTRACT_DIR="$(mktemp -d)"
            (cd "$EXTRACT_DIR" && "$OLDPWD/$appimg" --appimage-extract >/dev/null)
            test -e "$EXTRACT_DIR/squashfs-root/.DirIcon" || { echo "Missing .DirIcon inside $appimg" >&2; exit 1; }
            test -s "$EXTRACT_DIR/squashfs-root/mswnlink.png" || { echo "Missing mswnlink.png inside $appimg" >&2; exit 1; }
            rm -rf "$EXTRACT_DIR"
            echo "Verified embedded AppImage file icon (.DirIcon) in $appimg"
          done

      - name: Package macOS DMG (Developer ID if configured, inside-out ad-hoc signed otherwise)
        id: package_macos
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_MODE: ${{ steps.mac_sign_mode.outputs.mode }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          package_unsigned() {
            rm -rf release
            mkdir -p release
            echo "Building DMG without Apple Developer ID; scripts/after-pack.cjs applies inside-out ad-hoc signing with ScreenCaptureKit & helper entitlements."

            # Do not set CSC_LINK='' — electron-builder treats an empty string as a directory path.
            local package_backup
            package_backup="$(mktemp)" || return 1
            cp package.json "$package_backup" || { rm -f "$package_backup"; return 1; }

            if ! node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.build=p.build||{}; p.build.mac=p.build.mac||{}; p.build.mac.identity=null; p.build.mac.hardenedRuntime=false; p.build.mac.gatekeeperAssess=false; delete p.build.mac.notarize; p.build.dmg=Object.assign({}, p.build.dmg||{}, { filesystem: "APFS", format: "UDZO", sign: false }); fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'; then
              cp "$package_backup" package.json
              rm -f "$package_backup"
              echo 'Could not apply unsigned macOS build configuration.' >&2
              return 1
            fi

            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD
            unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_PASSWORD APPLE_ID APPLE_TEAM_ID
            unset CSC_IDENTITY_AUTO_DISCOVERY
            export CSC_IDENTITY_AUTO_DISCOVERY=false

            local build_status=0
            if npx electron-builder ${{ matrix.dist_args }} --publish never; then
              build_status=0
            else
              build_status=$?
            fi
            cp "$package_backup" package.json
            rm -f "$package_backup"
            if [ "$build_status" -ne 0 ]; then
              echo 'Unsigned macOS package step failed; see electron-builder output above.' >&2
              return "$build_status"
            fi

            shopt -s nullglob
            local files=(release/*.dmg)
            if [ "${#files[@]}" -eq 0 ]; then
              echo 'electron-builder completed but no DMG was created.' >&2
              return 1
            fi

            # Ensure generated DMGs pass strict Apple disk verification + clean Finder-parity attach;
            # if dmg-builder's staging left an HFS+/legacy quirk on newer macOS, rebuild a clean APFS UDZO DMG directly from the signed .app.
            local built_app
            built_app="$(find release -maxdepth 2 -type d -name '*.app' -print -quit || true)"
            for dmg_file in "${files[@]}"; do
              xattr -cr "$dmg_file" 2>/dev/null || true
              local test_mount
              test_mount="$(mktemp -d)"
              if hdiutil verify "$dmg_file" && hdiutil attach "$dmg_file" -mountpoint "$test_mount" -nobrowse -readonly -quiet; then
                hdiutil detach "$test_mount" -quiet >/dev/null 2>&1 || hdiutil detach "$test_mount" -force -quiet >/dev/null 2>&1 || true
                rm -rf "$test_mount"
              else
                hdiutil detach "$test_mount" -force -quiet >/dev/null 2>&1 || true
                rm -rf "$test_mount"
                if [ -z "$built_app" ]; then
                  echo "Generated DMG $dmg_file failed hdiutil verify and no .app bundle was found to rebuild it." >&2
                  return 1
                fi
                echo "::warning::$dmg_file failed strict hdiutil verify; rebuilding clean APFS UDZO DMG from $built_app."
                local stage_dir
                stage_dir="$(mktemp -d)"
                ditto "$built_app" "$stage_dir/$(basename "$built_app")"
                ln -s /Applications "$stage_dir/Applications"
                xattr -cr "$stage_dir/$(basename "$built_app")" 2>/dev/null || true
                hdiutil create -volname "mswnlink" -srcfolder "$stage_dir" -fs APFS -format UDZO -ov "$dmg_file"
                rm -rf "$stage_dir"
                xattr -cr "$dmg_file" 2>/dev/null || true
              fi
            done
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          }

          if [ "${SIGN_MODE:-unsigned}" = "signed" ]; then
            echo "Attempting Developer ID signed and notarized macOS build."
            signed_backup="$(mktemp)"
            cp package.json "$signed_backup"
            node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.build=p.build||{}; p.build.mac=p.build.mac||{}; p.build.mac.notarize=true; p.build.dmg=Object.assign({}, p.build.dmg||{}, { filesystem: "APFS", format: "UDZO", sign: true }); fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'
            signed_ok=0
            if env CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD" APPLE_API_KEY="$APPLE_API_KEY" APPLE_API_KEY_ID="$APPLE_API_KEY_ID" APPLE_API_ISSUER="$APPLE_API_ISSUER" CSC_IDENTITY_AUTO_DISCOVERY=true npx electron-builder ${{ matrix.dist_args }} --publish never; then
              signed_ok=1
            fi
            cp "$signed_backup" package.json
            rm -f "$signed_backup"

            if [ "$signed_ok" -eq 1 ]; then
              APP_PATH="$(find release -maxdepth 2 -type d -name '*.app' -print -quit)"
              DMG_PATH="$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)"
              if [ -n "$APP_PATH" ] && [ -n "$DMG_PATH" ]; then
                if codesign --verify --deep --strict --verbose=2 "$APP_PATH" && \
                   spctl --assess --verbose=4 --type execute "$APP_PATH" && \
                   xcrun stapler validate "$APP_PATH" && \
                   hdiutil verify "$DMG_PATH"; then
                  echo "mode=signed" >> "$GITHUB_OUTPUT"
                else
                  echo "::warning::Signed app verification failed. Retrying with inside-out ad-hoc signature."
                  package_unsigned || exit 1
                fi
              else
                echo "::warning::Signed build produced no app or DMG. Retrying with inside-out ad-hoc signature."
                package_unsigned || exit 1
              fi
            else
              echo "::warning::Signed macOS build failed. Retrying with inside-out ad-hoc signature so a working DMG is produced."
              package_unsigned || exit 1
            fi
          else
            package_unsigned || exit 1
          fi

      - name: Verify macOS DMG integrity, signature, TCC bundle ID, Info.plist, and entitlements
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "Verifying $dmg"
            hdiutil verify "$dmg"
            MOUNT="$(mktemp -d)"
            cleanup_mount() {
              hdiutil detach "$MOUNT" -quiet >/dev/null 2>&1 || hdiutil detach "$MOUNT" -force -quiet >/dev/null 2>&1 || true
              rm -rf "$MOUNT"
            }
            trap cleanup_mount EXIT

            hdiutil attach "$dmg" -mountpoint "$MOUNT" -nobrowse -readonly -quiet
            APP="$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$APP" || { echo "No .app inside $dmg" >&2; exit 1; }
            test -x "$APP/Contents/MacOS/mswnlink" || { echo "Main binary is not executable inside $dmg" >&2; exit 1; }

            # 1. Strict deep signature & quarantine-free bundle verification
            codesign --verify --deep --strict --verbose=2 "$APP"
            if xattr -lr "$APP" 2>/dev/null | grep -q "com.apple.quarantine"; then
              echo "Unexpected quarantine xattr baked inside $dmg" >&2
              exit 1
            fi

            # 2. Stable bundle identifier required for macOS ScreenCapture & Accessibility TCC
            SIGN_INFO="$(codesign -dv "$APP" 2>&1)"
            echo "$SIGN_INFO" | grep -q "Identifier=com.mswnlink.lan" || {
              echo "Expected Identifier=com.mswnlink.lan on $APP, got:" >&2
              echo "$SIGN_INFO" >&2
              exit 1
            }

            # 3. Info.plist syntax, privacy usage descriptions, and bundle icon required for macOS
            PLIST="$APP/Contents/Info.plist"
            plutil -lint "$PLIST"
            SCREEN_DESC="$(plutil -extract NSScreenCaptureUsageDescription raw -o - "$PLIST")"
            ACCESS_DESC="$(plutil -extract NSAccessibilityUsageDescription raw -o - "$PLIST")"
            ICON_FILE="$(plutil -extract CFBundleIconFile raw -o - "$PLIST")"
            test -n "$SCREEN_DESC" || { echo "Missing NSScreenCaptureUsageDescription in Info.plist" >&2; exit 1; }
            test -n "$ACCESS_DESC" || { echo "Missing NSAccessibilityUsageDescription in Info.plist" >&2; exit 1; }
            test -n "$ICON_FILE" || { echo "Missing CFBundleIconFile in Info.plist" >&2; exit 1; }

            # 4. Verify GPU & Renderer Helper .app bundles retain JIT / unsigned-executable-memory entitlements when entitlements plists are configured
            if [ -f "build/entitlements.mac.inherit.plist" ]; then
              for helper_name in "mswnlink Helper (GPU).app" "mswnlink Helper (Renderer).app"; do
                HELPER_PATH="$APP/Contents/Frameworks/$helper_name"
                if [ -d "$HELPER_PATH" ]; then
                  HELPER_ENT="$(codesign -d --entitlements :- "$HELPER_PATH" 2>/dev/null || true)"
                  echo "$HELPER_ENT" | grep -q "com.apple.security.cs.allow-unsigned-executable-memory" || {
                    echo "Missing allow-unsigned-executable-memory entitlement on $helper_name" >&2
                    exit 1
                  }
                fi
              done
            else
              echo "Skipping custom helper entitlements check (no build/entitlements.mac*.plist present)."
            fi

            cleanup_mount
            trap - EXIT
          done

      - name: List generated output files
        shell: bash
        run: |
          ls -lah release
          find release -maxdepth 1 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mswnlink-${{ matrix.label }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; else echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"; fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mswnlink-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          linux_files=(release-assets/*.AppImage)
          windows_files=(release-assets/*.exe)
          dmg_files=(release-assets/*.dmg)
          if [ "${#linux_files[@]}" -lt 1 ]; then echo 'No Fedora/Linux AppImage was downloaded from build artifacts.' >&2; exit 1; fi
          if [ "${#windows_files[@]}" -lt 1 ]; then echo 'No Windows executable was downloaded from build artifacts.' >&2; exit 1; fi
          if [ "${#dmg_files[@]}" -lt 2 ]; then echo "Expected Intel and Apple Silicon DMGs, found ${#dmg_files[@]}." >&2; ls -lah release-assets; exit 1; fi
          (cd release-assets && sha256sum *.AppImage *.exe *.dmg > SHA256SUMS.txt)
          ls -lah release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: mswnlink ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### What's New in mswnlink v4
            - **Fedora 44 & 45 Wayland Sync & Live Keyboard Language Switching**: Synchronizes viewer-to-host OS keyboard language changes automatically (`navigator.keyboard` + first-key language detection switching GNOME XKB `mru-sources` / `switch-input-source`, KDE Plasma D-Bus, Windows `WM_INPUTLANGCHANGEREQUEST`, and macOS input sources); fixes fractional-scaling `logical_size` pointer accuracy (`Invalid position` retry + corner re-anchoring), Wayland <-> XWayland `wl-paste`/`wl-copy` clipboard bridging, and low-latency WebRTC video stall recovery (`playoutDelayHint = 0`, 4.5s stall watchdog).
            - **UI & Visual Bug Fixes**: Eliminates dark-mode theme-switch transition flicker (white-on-white buttons and dimmed tab text), prevents session toasts from overlapping footer controls, fixes narrow mobile top-bar crowding, tightens Share bar backdrop masking, and places the fullscreen exit pill below remote desktop top panels.
            - **Buttonless File & Context Copy/Paste + Drag-and-Drop**: Copy and paste files (`Ctrl+C` / `Ctrl+V` or `Cmd+C` / `Cmd+V`), formatted HTML context, and images across Windows, macOS, and Fedora Linux, or drag and drop files straight onto the remote screen to save to Downloads without manual buttons.
            - **Windows Remote Desktop (`mstsc.exe`) Host Share Keep-Alive & Console Handoff**: Closing Windows Remote Desktop no longer stops `mswnlink` screen sharing automatically. The elevated Win32 helper watches `WTSQuerySessionInformation` to transfer disconnected RDP sessions back to the unlocked local console (`tscon.exe <SessionId> /dest:console` + `OpenInputDesktop`/`SetThreadDesktop`), while `renderer.js` keeps the LAN host & WebRTC peer alive and hot-swaps capture (`replaceTrack`) onto the local Windows display.
            - **Fedora Greek Keyboard Input (Client & Host) & Single-Character Typing**: Deterministic client-side Greek dead-key composition (`;` + `ε` → `έ`, dialytika `ϊ`/`ΐ`), single-key `typeBatch` injection without double letters or ASCII-to-Greek clobbering, and standard `default` cursor (crosshair removed).
            - **Fedora Fullscreen Top-of-Screen Visibility (Host & Client)**: Synchronizes viewer fullscreen with Electron's native `BrowserWindow.setFullScreen`, clamps frameless Linux windows to `display.workArea`, and constrains `#remote-video` (`min-height: 0; max-height: 100%; object-fit: contain`).
            - **Restored Original mswnlink Logo Across App & All Executables**: Classic 4-quadrant mswnlink emblem across the app UI and all built executables (`mswnlink-windows-v4-x64.exe`, `mswnlink-macos-v4-arm64.dmg`, `mswnlink-macos-v4-x64.dmg`, and `mswnlink-fedora-v4-x86_64.AppImage`).
            - **Wayland Portal Stability, Electron 45 Clipboard & Task Manager UIPI**: Native Python3 `Gio.DBusConnection` portal worker, non-sticking **Start/Stop sharing**, async Electron 45 clipboard sync, macOS Sequoia ScreenCaptureKit fallback, and Windows Task Manager `SendInput` helper.

            ### Install or Upgrade on macOS Sequoia / Tahoe (clears browser quarantine & refreshes TCC permissions)
            Paste into Terminal (zero-prompt install without Apple Developer ID notarization):
            ```bash
            curl -fsSL https://raw.githubusercontent.com/johnzach199/mswnlink/main/scripts/install-mac.sh | bash
            ```
            If you downloaded the `.dmg` in Safari/Chrome and macOS says `"mswnlink" is damaged and can't be opened`, drag `mswnlink.app` to Applications and run:
            ```bash
            xattr -cr /Applications/mswnlink.app
            ```
            (Or add `MAC_CSC_LINK`, `MAC_CSC_KEY_PASSWORD`, `APPLE_API_KEY`, `APPLE_API_KEY_ID`, and `APPLE_API_ISSUER` repository secrets to sign and notarize directly in CI.)
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
