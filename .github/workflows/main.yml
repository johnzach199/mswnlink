+class RobotBackend {
+  constructor(robot, note = '') {
+    this.kind = 'robotjs';
+    this.robot = robot;
+    this.note = note;
+    this.heldKeys = new Set();
+    this.heldButtons = new Set();
+    this.wheelX = 0;
+    this.wheelY = 0;
+  }
+
+  async start() { return this.describe(); }
+  stop() { this.releaseAll(); }
+
+  describe() {
+    return { available: true, ready: true, kind: this.kind, state: 'ready', message: this.note };
+  }
