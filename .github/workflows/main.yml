name: Build and Publish mswnlink Executables

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to attach builds to (for example v2.8). Leave blank for test artifacts only."
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Build mswnlink for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: dist:fedora
            label: fedora-x64
          - os: windows-latest
            script: dist:win
            label: windows-x64
          - os: macos-15-intel
            script: dist:mac
            label: macos-intel-x64
          - os: macos-15
            script: dist:mac
            label: macos-apple-silicon-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Determine macOS signing mode
        id: mac_sign_mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          names=(MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          present=0
          missing=()
          for name in "${names[@]}"; do
            if [ -n "${!name}" ]; then present=$((present + 1)); else missing+=("$name"); fi
          done
          if [ "$present" -eq 5 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "All Apple signing/notarization secrets are present. The workflow will try a signed build first."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are incomplete (missing: ${missing[*]}). The DMG will be signed ad hoc (users approve it once or use scripts/install-mac.sh)."
          fi

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 make g++ pkg-config libxtst-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxkbfile-dev libxfixes-dev libxdamage-dev libxrender-dev libxi-dev libpng-dev libpng++-dev

      - name: Print build environment
        shell: bash
        run: |
          node --version
          npm --version
          node -p "process.platform + ' ' + process.arch"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript
        run: npm run check

      - name: Build native input backend
        run: npm run rebuild:native

      - name: Verify native input backend
        run: node -e "const r=require('robotjs'); if (!r || typeof r.moveMouse !== 'function' || typeof r.keyToggle !== 'function') process.exit(1); console.log('RobotJS native input backend loaded')"

      - name: Package Linux or Windows application
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }}

      - name: Package macOS app (Developer ID if configured, ad-hoc signed otherwise)
        id: package_macos
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_MODE: ${{ steps.mac_sign_mode.outputs.mode }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          package_unsigned() {
            rm -rf release
            mkdir -p release
            echo "Building a DMG without Apple credentials; scripts/after-pack.cjs signs it ad hoc."

            # IMPORTANT: don't set CSC_LINK='' — some electron-builder versions resolve
            # an empty certificate path to the current workspace directory, causing
            # errors such as '/Users/runner/work/mswnlink/mswnlink not a file'.
            local package_backup
            package_backup="$(mktemp)" || return 1
            cp package.json "$package_backup" || { rm -f "$package_backup"; return 1; }

            if ! node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.build=p.build||{}; p.build.mac=p.build.mac||{}; p.build.mac.identity=null; p.build.mac.hardenedRuntime=false; delete p.build.mac.notarize; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'; then
              cp "$package_backup" package.json
              rm -f "$package_backup"
              echo 'Could not apply unsigned macOS build configuration.' >&2
              return 1
            fi

            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD
            unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_PASSWORD APPLE_ID APPLE_TEAM_ID
            unset CSC_IDENTITY_AUTO_DISCOVERY
            export CSC_IDENTITY_AUTO_DISCOVERY=false

            local build_status=0
            if npm run dist:mac; then
              build_status=0
            else
              build_status=$?
            fi
            cp "$package_backup" package.json
            rm -f "$package_backup"
            if [ "$build_status" -ne 0 ]; then
              echo 'Unsigned macOS package step failed; see electron-builder output above.' >&2
              return "$build_status"
            fi

            shopt -s nullglob
            local files=(release/*.dmg)
            if [ "${#files[@]}" -eq 0 ]; then
              echo 'electron-builder completed but no DMG was created.' >&2
              return 1
            fi
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          }

          if [ "${SIGN_MODE:-unsigned}" = "signed" ]; then
            echo "Attempting signed and notarized macOS build."
            if env CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD" APPLE_API_KEY="$APPLE_API_KEY" APPLE_API_KEY_ID="$APPLE_API_KEY_ID" APPLE_API_ISSUER="$APPLE_API_ISSUER" CSC_IDENTITY_AUTO_DISCOVERY=true npm run dist:mac; then
              APP_PATH="$(find release -type d -name '*.app' -print -quit)"
              DMG_PATH="$(find release -type f -name '*.dmg' -print -quit)"
              if [ -n "$APP_PATH" ] && [ -n "$DMG_PATH" ]; then
                if codesign --verify --deep --strict --verbose=2 "$APP_PATH" && \
                   spctl --assess --verbose=4 --type execute "$APP_PATH" && \
                   xcrun stapler validate "$DMG_PATH"; then
                  echo "mode=signed" >> "$GITHUB_OUTPUT"
                else
                  echo "::warning::Signed app verification failed. Retrying with an ad-hoc signature."
                  package_unsigned || exit 1
                fi
              else
                echo "::warning::Signed build produced no app or DMG. Retrying with an ad-hoc signature."
                package_unsigned || exit 1
              fi
            else
              echo "::warning::Signed macOS build failed. Retrying with signing explicitly disabled so a test DMG can still be produced."
              package_unsigned || exit 1
            fi
          else
            package_unsigned || exit 1
          fi

      # An invalid signature is what makes macOS call an app "damaged". Fail here instead of publishing it.
      - name: Verify the app signature inside every DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "Checking $dmg"
            MOUNT="$(mktemp -d)"
            hdiutil attach "$dmg" -mountpoint "$MOUNT" -nobrowse -quiet
            APP="$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$APP" || { echo "No .app inside $dmg" >&2; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$APP"
            hdiutil detach "$MOUNT" -quiet
          done

      - name: List generated output files
        shell: bash
        run: |
          ls -lah release
          find release -maxdepth 1 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mswnlink-${{ matrix.label }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; else echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"; fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mswnlink-*
          path: release-assets
          merge-multiple: true

      - name: Verify and prepare release assets (do not skip DMGs)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          linux_files=(release-assets/*.AppImage)
          windows_files=(release-assets/*.exe)
          dmg_files=(release-assets/*.dmg)
          if [ "${#linux_files[@]}" -lt 1 ]; then echo 'No Fedora/Linux AppImage was downloaded from build artifacts.' >&2; exit 1; fi
          if [ "${#windows_files[@]}" -lt 1 ]; then echo 'No Windows executable was downloaded from build artifacts.' >&2; exit 1; fi
          if [ "${#dmg_files[@]}" -lt 2 ]; then echo "Expected Intel and Apple Silicon DMGs, found ${#dmg_files[@]}." >&2; ls -lah release-assets; exit 1; fi
          ls -lah release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: main
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### Install on a Mac without the "Apple could not verify..." warning
            Paste this once into Terminal (it downloads with curl, so macOS never flags the app):
            ```
            curl -fsSL https://raw.githubusercontent.com/johnzach199/mswnlink/main/scripts/install-mac.sh | bash
            ```
            Or open the DMG normally and, when macOS blocks it, go to System Settings > Privacy & Security and choose Open Anyway.
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
