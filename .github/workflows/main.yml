name: Build and Publish mswnlink Executables

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to attach trusted builds to (for example v0.2.2). Leave blank for test artifacts only."
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Build mswnlink for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: dist:fedora
            label: fedora-x64
          - os: windows-latest
            script: dist:win
            label: windows-x64
          - os: macos-15-intel
            script: dist:mac
            label: macos-intel-x64
          - os: macos-15
            script: dist:mac
            label: macos-apple-silicon-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          # This project intentionally has no package-lock.json. Disable automatic
          # npm cache setup so setup-node doesn't fail looking for a lockfile.
          package-manager-cache: false

      - name: Determine macOS signing mode
        id: mac_sign_mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          names=(MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          present=0
          missing=()
          for name in "${names[@]}"; do
            if [ -n "${!name}" ]; then present=$((present + 1)); else missing+=("$name"); fi
          done
          if [ "$present" -eq 5 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "Apple signing and notarization credentials found."
          elif [ "$present" -eq 0 ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple signing secrets found. Producing an unsigned test DMG only; Gatekeeper may block it."
          else
            printf 'Partial Apple signing configuration. Missing: %s\n' "${missing[*]}" >&2
            echo 'Configure all five Apple secrets, or remove all five to produce an unsigned test artifact.' >&2
            exit 1
          fi

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 make g++ pkg-config libxtst-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxkbfile-dev libxfixes-dev libxdamage-dev libxrender-dev libxi-dev libpng-dev libpng++-dev

      - name: Print build environment
        run: |
          node --version
          npm --version
          node -p "process.platform + ' ' + process.arch"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript
        run: npm run check

      - name: Build native input backend
        run: npm run rebuild:native

      - name: Verify native input backend
        run: node -e "const r=require('robotjs'); if (!r || typeof r.moveMouse !== 'function' || typeof r.keyTap !== 'function') process.exit(1); console.log('RobotJS native input backend loaded')"

      - name: Package standalone application
        run: npm run ${{ matrix.script }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' && steps.mac_sign_mode.outputs.mode == 'unsigned' && 'false' || 'true' }}

      - name: Verify signed macOS app and notarization
        if: runner.os == 'macOS' && steps.mac_sign_mode.outputs.mode == 'signed'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -type d -name '*.app' -print -quit)"
          DMG_PATH="$(find release -type f -name '*.dmg' -print -quit)"
          test -n "$APP_PATH" || { echo 'No .app bundle produced.' >&2; exit 1; }
          test -n "$DMG_PATH" || { echo 'No DMG produced.' >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --verbose=4 --type execute "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Label unsigned macOS test artifact
        if: runner.os == 'macOS' && steps.mac_sign_mode.outputs.mode == 'unsigned'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.dmg)
          if [ "${#files[@]}" -eq 0 ]; then echo 'No DMG produced.' >&2; exit 1; fi
          for file in "${files[@]}"; do mv "$file" "${file%.dmg}-UNSIGNED-TEST-ONLY.dmg"; done
          cat > release/UNSIGNED-MACOS-WARNING.txt <<'NOTICE'
          UNSIGNED TEST BUILD — Apple code signing and notarization were not configured.
          macOS Gatekeeper may block this app. Do not distribute this as a trusted public release.
          Configure MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD, APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER to produce a signed and notarized release.
          NOTICE

      - name: List generated output files
        shell: bash
        run: find release -maxdepth 2 -type f -printf '%p (%s bytes)\n' || ls -lah release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mswnlink-${{ matrix.label }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/UNSIGNED-MACOS-WARNING.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release assets (unsigned Mac DMGs excluded)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; else echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"; fi

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mswnlink-*
          path: release-assets
          merge-multiple: true

      - name: Exclude unsigned macOS builds from public release
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          unsigned=(release-assets/*UNSIGNED-TEST-ONLY.dmg)
          for file in "${unsigned[@]}"; do rm -f "$file"; done
          rm -f release-assets/UNSIGNED-MACOS-WARNING.txt
          if [ -n "${MAC_CSC_LINK}" ] && [ -n "${MAC_CSC_KEY_PASSWORD}" ] && [ -n "${APPLE_API_KEY}" ] && [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER}" ]; then
            echo 'Apple credentials are configured; signed/notarized macOS builds can be included if present.'
          elif [ "${#unsigned[@]}" -gt 0 ]; then
            echo 'Unsigned macOS DMGs have been removed from public release assets; they remain in workflow artifacts.'
          fi
          ls -lah release-assets
          compgen -G 'release-assets/*.AppImage' >/dev/null || compgen -G 'release-assets/*.exe' >/dev/null || { echo 'No Linux or Windows release artifacts found.' >&2; exit 1; }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: main
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
