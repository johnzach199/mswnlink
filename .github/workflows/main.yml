name: Build and Publish mswnlink Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish (for example v3.3). Leave blank to build downloadable test artifacts only."
        required: false
        type: string

concurrency:
  group: mswnlink-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  package:
    name: Build mswnlink for ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            dist_args: "--linux AppImage --x64"
            label: fedora-x64
          - os: windows-latest
            arch: x64
            dist_args: "--win portable --x64"
            label: windows-x64
          - os: macos-15-intel
            arch: x64
            dist_args: "--mac dmg --x64"
            label: macos-intel-x64
          - os: macos-15
            arch: arm64
            dist_args: "--mac dmg --arm64"
            label: macos-apple-silicon-arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Determine macOS signing mode
        id: mac_sign_mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          names=(MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER)
          present=0
          missing=()
          for name in "${names[@]}"; do
            if [ -n "${!name}" ]; then present=$((present + 1)); else missing+=("$name"); fi
          done
          if [ "$present" -eq 5 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "All Apple signing/notarization secrets are present. Attempting Developer ID signed build first."
          else
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are incomplete (missing: ${missing[*]}). Packaging inside-out ad-hoc signed DMG with ScreenCaptureKit & helper entitlements via scripts/after-pack.cjs."
          fi

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential python3 make g++ pkg-config \
            libxtst-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxkbfile-dev libxfixes-dev libxdamage-dev libxrender-dev libxi-dev \
            libpng-dev libpng++-dev
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Print build environment
        shell: bash
        run: |
          node --version
          npm --version
          node -p "process.platform + ' ' + process.arch + ' -> target ${{ matrix.arch }}'"

      - name: Install dependencies
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax across all modules
        shell: bash
        run: npm run check

      - name: Run automated unit tests (clipboard shortcuts, macOS TCC, drag clamping)
        shell: bash
        run: |
          if [ -f test/input-protocol.test.js ]; then
            npm test
          fi

      - name: Verify Windows C# SendInput & Task Manager UIPI worker compiles
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath 'win32-input.js')) {
            Write-Host 'win32-input.js not present; skipping C# worker check.'
            exit 0
          }
          $raw = [System.IO.File]::ReadAllText((Resolve-Path -LiteralPath 'win32-input.js'))
          $match = [regex]::Match($raw, '(?s)\$code\s*=\s*@"[\r\n]+(.*?)[\r\n]+"@')
          if (-not $match.Success) {
            throw 'Could not extract C# worker source from win32-input.js.'
          }
          Add-Type -TypeDefinition $match.Groups[1].Value -Language CSharp
          $elevated = [MswnlinkWin32Worker]::IsElevated()
          Write-Host "Verified MswnlinkWin32Worker C# compilation under Windows PowerShell $($PSVersionTable.PSVersion) (IsElevated=$elevated)"

      - name: Build native RobotJS input backend for Electron
        shell: bash
        run: npx electron-rebuild -f -w robotjs --arch ${{ matrix.arch }}

      - name: Verify compiled RobotJS native input backend
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const robotDir = path.join("node_modules", "robotjs");
            const candidates = [];
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, e.name);
                if (e.isDirectory()) walk(p);
                else if (e.name.endsWith(".node")) candidates.push(p);
              }
            }
            walk(path.join(robotDir, "build"));
            walk(path.join(robotDir, "prebuilds"));
            const validBin = candidates.find((f) => fs.statSync(f).size >= 4096);
            if (!validBin) {
              console.error("No valid RobotJS .node binary found in build/ or prebuilds/");
              process.exit(1);
            }
            const r = require("robotjs");
            if (!r || typeof r.moveMouse !== "function" || typeof r.keyToggle !== "function") {
              console.error("RobotJS native module exports failed verification");
              process.exit(1);
            }
            console.log("Verified RobotJS native input backend:", validBin, "(" + fs.statSync(validBin).size + " bytes)");
          '

      - name: Package Linux or Windows executable
        if: runner.os != 'macOS'
        shell: bash
        run: npx electron-builder ${{ matrix.dist_args }} --publish never

      - name: Package macOS DMG (Developer ID if configured, inside-out ad-hoc signed otherwise)
        id: package_macos
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_MODE: ${{ steps.mac_sign_mode.outputs.mode }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail

          package_unsigned() {
            rm -rf release
            mkdir -p release
            echo "Building DMG without Apple Developer ID; scripts/after-pack.cjs applies inside-out ad-hoc signing with ScreenCaptureKit & helper entitlements."

            # Do not set CSC_LINK='' — electron-builder treats an empty string as a directory path.
            local package_backup
            package_backup="$(mktemp)" || return 1
            cp package.json "$package_backup" || { rm -f "$package_backup"; return 1; }

            if ! node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.build=p.build||{}; p.build.mac=p.build.mac||{}; p.build.mac.identity=null; p.build.mac.hardenedRuntime=false; delete p.build.mac.notarize; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'; then
              cp "$package_backup" package.json
              rm -f "$package_backup"
              echo 'Could not apply unsigned macOS build configuration.' >&2
              return 1
            fi

            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME CSC_INSTALLER_LINK CSC_INSTALLER_KEY_PASSWORD
            unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD
            unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_PASSWORD APPLE_ID APPLE_TEAM_ID
            unset CSC_IDENTITY_AUTO_DISCOVERY
            export CSC_IDENTITY_AUTO_DISCOVERY=false

            local build_status=0
            if npx electron-builder ${{ matrix.dist_args }} --publish never; then
              build_status=0
            else
              build_status=$?
            fi
            cp "$package_backup" package.json
            rm -f "$package_backup"
            if [ "$build_status" -ne 0 ]; then
              echo 'Unsigned macOS package step failed; see electron-builder output above.' >&2
              return "$build_status"
            fi

            shopt -s nullglob
            local files=(release/*.dmg)
            if [ "${#files[@]}" -eq 0 ]; then
              echo 'electron-builder completed but no DMG was created.' >&2
              return 1
            fi
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
          }

          if [ "${SIGN_MODE:-unsigned}" = "signed" ]; then
            echo "Attempting Developer ID signed and notarized macOS build."
            signed_backup="$(mktemp)"
            cp package.json "$signed_backup"
            node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.build=p.build||{}; p.build.mac=p.build.mac||{}; p.build.mac.notarize=true; fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");'
            signed_ok=0
            if env CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD" APPLE_API_KEY="$APPLE_API_KEY" APPLE_API_KEY_ID="$APPLE_API_KEY_ID" APPLE_API_ISSUER="$APPLE_API_ISSUER" CSC_IDENTITY_AUTO_DISCOVERY=true npx electron-builder ${{ matrix.dist_args }} --publish never; then
              signed_ok=1
            fi
            cp "$signed_backup" package.json
            rm -f "$signed_backup"

            if [ "$signed_ok" -eq 1 ]; then
              APP_PATH="$(find release -type d -name '*.app' -print -quit)"
              DMG_PATH="$(find release -type f -name '*.dmg' -print -quit)"
              if [ -n "$APP_PATH" ] && [ -n "$DMG_PATH" ]; then
                if codesign --verify --deep --strict --verbose=2 "$APP_PATH" && \
                   spctl --assess --verbose=4 --type execute "$APP_PATH" && \
                   xcrun stapler validate "$DMG_PATH"; then
                  echo "mode=signed" >> "$GITHUB_OUTPUT"
                else
                  echo "::warning::Signed app verification failed. Retrying with inside-out ad-hoc signature."
                  package_unsigned || exit 1
                fi
              else
                echo "::warning::Signed build produced no app or DMG. Retrying with inside-out ad-hoc signature."
                package_unsigned || exit 1
              fi
            else
              echo "::warning::Signed macOS build failed. Retrying with inside-out ad-hoc signature so a working DMG is produced."
              package_unsigned || exit 1
            fi
          else
            package_unsigned || exit 1
          fi

      - name: Verify macOS DMG signature, TCC bundle ID, Info.plist descriptions, and helper entitlements
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in release/*.dmg; do
            echo "Verifying $dmg"
            MOUNT="$(mktemp -d)"
            cleanup_mount() {
              hdiutil detach "$MOUNT" -quiet >/dev/null 2>&1 || hdiutil detach "$MOUNT" -force -quiet >/dev/null 2>&1 || true
              rm -rf "$MOUNT"
            }
            trap cleanup_mount EXIT

            hdiutil attach "$dmg" -mountpoint "$MOUNT" -nobrowse -readonly -noverify -noautofsck -quiet
            APP="$(find "$MOUNT" -maxdepth 1 -name '*.app' -print -quit)"
            test -n "$APP" || { echo "No .app inside $dmg" >&2; exit 1; }

            # 1. Deep strict signature verification
            codesign --verify --deep --strict --verbose=2 "$APP"

            # 2. Stable bundle identifier required for macOS ScreenCapture & Accessibility TCC
            SIGN_INFO="$(codesign -dv "$APP" 2>&1)"
            echo "$SIGN_INFO" | grep -q "Identifier=com.mswnlink.lan" || {
              echo "Expected Identifier=com.mswnlink.lan on $APP, got:" >&2
              echo "$SIGN_INFO" >&2
              exit 1
            }

            # 3. Privacy usage descriptions required for macOS permission prompts
            PLIST="$APP/Contents/Info.plist"
            SCREEN_DESC="$(plutil -extract NSScreenCaptureUsageDescription raw -o - "$PLIST")"
            ACCESS_DESC="$(plutil -extract NSAccessibilityUsageDescription raw -o - "$PLIST")"
            test -n "$SCREEN_DESC" || { echo "Missing NSScreenCaptureUsageDescription in Info.plist" >&2; exit 1; }
            test -n "$ACCESS_DESC" || { echo "Missing NSAccessibilityUsageDescription in Info.plist" >&2; exit 1; }

            # 4. Verify GPU & Renderer Helper .app bundles retain JIT / unsigned-executable-memory entitlements
            for helper_name in "mswnlink Helper (GPU).app" "mswnlink Helper (Renderer).app"; do
              HELPER_PATH="$APP/Contents/Frameworks/$helper_name"
              if [ -d "$HELPER_PATH" ]; then
                HELPER_ENT="$(codesign -d --entitlements :- "$HELPER_PATH" 2>/dev/null || true)"
                echo "$HELPER_ENT" | grep -q "com.apple.security.cs.allow-unsigned-executable-memory" || {
                  echo "Missing allow-unsigned-executable-memory entitlement on $helper_name" >&2
                  exit 1
                }
              fi
            done

            cleanup_mount
            trap - EXIT
          done

      - name: List generated output files
        shell: bash
        run: |
          ls -lah release
          find release -maxdepth 1 -type f -print

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: mswnlink-${{ matrix.label }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"; else echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"; fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mswnlink-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          linux_files=(release-assets/*.AppImage)
          windows_files=(release-assets/*.exe)
          dmg_files=(release-assets/*.dmg)
          if [ "${#linux_files[@]}" -lt 1 ]; then echo 'No Fedora/Linux AppImage was downloaded from build artifacts.' >&2; exit 1; fi
          if [ "${#windows_files[@]}" -lt 1 ]; then echo 'No Windows executable was downloaded from build artifacts.' >&2; exit 1; fi
          if [ "${#dmg_files[@]}" -lt 2 ]; then echo "Expected Intel and Apple Silicon DMGs, found ${#dmg_files[@]}." >&2; ls -lah release-assets; exit 1; fi
          (cd release-assets && sha256sum *.AppImage *.exe *.dmg > SHA256SUMS.txt)
          ls -lah release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: mswnlink ${{ steps.tag.outputs.tag }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
          body: |
            ### What's Fixed in mswnlink 3.3
            - **Cross-OS Copy & Paste**: Live two-way clipboard sync when unfocused, atomic `Ctrl+V` / `Cmd+V` paste sync, echo-free manual clipboard send/get, macOS `Edit` menu routing, and preserved modifier flags on macOS hosts.
            - **macOS Screen Recording Permissions**: Synchronous `getDisplayMedia()` prompt activation, macOS 15 Sequoia picker fallback, inside-out ad-hoc Mach-O & helper entitlement signing (Intel x64 + Apple Silicon), and one-click reset for stale upgrade TCC entries.
            - **Windows Task Manager Control & Keyboard**: Named-Pipe Win32 `SendInput` worker with one-time UAC elevation, Medium-Integrity UIPI escape guard, multi-monitor `dipToScreenRect` scaling, and native `VK_SPACE` handling for dialogs.
            - **Resilient LAN Sessions**: Symmetric 25-second WebRTC transient disconnect recovery on both host and viewer.

            ### Install or Upgrade on macOS (clears Gatekeeper quarantine & refreshes stale TCC permissions)
            Paste into Terminal:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/johnzach199/mswnlink/main/scripts/install-mac.sh | bash
            ```
            Or open the `.dmg` normally and, if macOS blocks it, open **System Settings › Privacy & Security** and click **Open Anyway**.
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
